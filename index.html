<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aplikasi Monev BOS &amp; TPG 2026</title>
<link rel="icon" type="image/png" href="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png"><link rel="apple-touch-icon" href="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123e50}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style></head>
<body>
<style>
.loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#123e50;padding:24px;box-sizing:border-box;font-family:Arial,sans-serif;color:#f4f8fa;text-align:center}.loading[hidden]{display:none}.loading-content{width:min(440px,100%)}.loading p{font-size:15px;line-height:1.65;margin:8px 0;font-weight:600}.loading .loading-title{font-size:17px;font-weight:700;margin-bottom:8px}.progress-track{height:16px;margin:24px auto 0;border-radius:999px;overflow:hidden;background:linear-gradient(#062735,#245266);border:1px solid #ffffff25;box-shadow:inset 0 3px 6px #0006,0 1px 0 #ffffff25}.progress-fill{height:100%;width:42%;border-radius:999px;background:linear-gradient(180deg,#ffe1aa 0%,#ffad43 28%,#fa8018 60%,#c75405 100%);box-shadow:inset 0 1px 2px #fff9,inset 0 -2px 3px #94330066,0 0 12px #ff981a66;animation:loading-slide 2.2s ease-in-out infinite;will-change:transform}@keyframes loading-slide{from{transform:translateX(-105%)}to{transform:translateX(345%)}}@media(prefers-reduced-motion:reduce){.progress-fill{animation-duration:6s}}
.loading-content{width:min(680px,100%)}.loading-logo{display:block;width:80px;height:80px;object-fit:contain;margin:0 auto 24px;filter:drop-shadow(0 4px 8px #0003)}.loading .loading-message{white-space:nowrap}.progress-track{max-width:440px}@media(max-width:640px){.loading .loading-message{white-space:normal}}
</style>
<div class="loading" id="loading"><div class="loading-content"><img class="loading-logo" src="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png" alt="Logo Kementerian Agama" width="80" height="80"><div role="status"><p class="loading-title">Mohon menunggu...</p><p class="loading-message">Kami sedang menyelaraskan data Anda untuk performa terbaik</p></div><div class="progress-track" aria-hidden="true"><div class="progress-fill"></div></div></div></div>
<iframe id="appFrame" title="Aplikasi Monev BOS &amp; TPG 2026" allow="fullscreen"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{document.getElementById('loading').hidden=true;});
const base='https://script.google.com/macros/s/AKfycbzWoE3QKJ-yqIHepawdHcPBjpScYMqVpDKAzEOaZTv2vPRc2g3PAOohclYX_cSXSeBB/exec';
const shareToken=new URLSearchParams(location.search).get('ba');
if(shareToken&&/^[0-9a-f-]{60,90}$/i.test(shareToken)){
  document.title='Berita Acara Hasil Monev';
  frame.src=base+'?ba='+encodeURIComponent(shareToken);
}else{
  frame.src=base;
}
</script>
</body></html>
