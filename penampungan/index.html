<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Membuka Portal Penampungan Monev</title><link rel="icon" type="image/png" href="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#123e50,#087e75);font:16px/1.55 Arial,sans-serif;color:#14384d}.card{width:min(440px,calc(100vw - 40px));padding:30px;border-radius:20px;background:#fff;text-align:center;box-shadow:0 18px 52px #0004}.logo{width:72px;height:72px;object-fit:contain}.spin{width:26px;height:26px;margin:18px auto;border:4px solid #b9dcd8;border-top-color:#087e75;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:9px;background:#087e75;color:#fff;text-decoration:none;font-weight:bold}small{color:#526d7c}</style></head><body><main class="card"><img class="logo" src="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png" alt="Logo Kementerian Agama"><h1>Portal Penampungan Dokumen Monev</h1><p>Portal sedang dibuka secara aman.</p><div class="spin" aria-hidden="true"></div><p><small>Jika tidak berpindah otomatis, gunakan tombol berikut.</small></p><a id="openPortal" href="https://script.google.com/macros/s/AKfycbyN3pH0McmNG1L0Qv1_tiRYTI9Z8nPFd7r77JTlfLPlcoLdpYOsnubLyFg4hz_BlOn5/exec">Buka Portal Penampungan</a></main><script>const target=document.getElementById('openPortal').href;window.location.replace(target);</script></body></html>
