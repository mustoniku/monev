<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portal Penampungan Dokumen Monev</title>
<link rel="icon" type="image/png" href="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png"><link rel="apple-touch-icon" href="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png">
<style>html,body{margin:0;width:100%;height:100%;background:#123e50;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;height:100dvh;border:0;background:white}.notice{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);padding:24px;border-radius:18px;background:white;color:#12304a;text-align:center;box-shadow:0 10px 50px #0003}.notice img{width:64px}.notice[hidden]{display:none}.notice button{padding:10px;border:0;border-radius:8px;background:#087e75;color:white;cursor:pointer}</style></head>
<body><div class="notice" id="notice"><img src="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png" alt="Logo Kemenag"><h2>Portal Penampungan Dokumen Monev</h2><p id="message">Memuat aplikasi…</p><button type="button" id="dismiss">Tutup pemberitahuan</button></div>
<iframe id="appFrame" title="Portal Penampungan Dokumen Monev" src="https://script.google.com/macros/s/AKfycbyN3pH0McmNG1L0Qv1_tiRYTI9Z8nPFd7r77JTlfLPlcoLdpYOsnubLyFg4hz_BlOn5/exec" allow="fullscreen"></iframe>
<script>const notice=document.getElementById('notice');document.getElementById('dismiss').onclick=()=>notice.hidden=true;document.getElementById('appFrame').addEventListener('load',()=>notice.hidden=true);setTimeout(()=>{if(!notice.hidden)document.getElementById('message').textContent='Pemuatan membutuhkan waktu lebih lama. Pastikan koneksi tersedia dan versi Apps Script untuk domain tetap sudah diterapkan.';},15000);</script>
</body></html>
